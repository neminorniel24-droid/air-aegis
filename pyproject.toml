[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-aegis"
version = "0.1.0"
description = "Multi-sensor airspace early-warning and decision-support simulation platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
